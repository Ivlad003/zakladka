# The project's page on GitHub Pages: site/ (description, screenshots, video) at the root and the
# app itself, built from this commit, under /app/.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Relative paths, so the app works from any folder (here: /<repository>/app/).
      - run: npm run build -- --base=./
      - name: Put the page and the app together
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r dist _site/app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
